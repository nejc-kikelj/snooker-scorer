name: Rule tests

on:
  push:
  pull_request:

jobs:
  rulebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python tests/rulebook_tests.py
